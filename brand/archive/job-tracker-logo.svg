<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-label="Job Tracker logo system">
  <title>Job Tracker — Logo System</title>
  <desc>Calm productivity identity: pathmark symbol + wordmark lockups</desc>

  <!-- Canvas -->
  <rect width="960" height="640" fill="#F4F1EC"/>

  <!-- =========================
       PRIMARY LOCKUP
       ========================= -->
  <g id="primary-lockup" transform="translate(80 72)">
    <!-- Symbol: pathmark — stages along a calm ascending track -->
    <g id="symbol-color">
      <rect width="88" height="88" rx="22" fill="#1F2A24"/>
      <!-- track rail -->
      <path d="M26 58 C26 58 28 34 44 28 C60 22 62 40 62 40" stroke="#C8D5C3" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <!-- stage nodes -->
      <circle cx="26" cy="58" r="5.5" fill="#8FAE8B"/>
      <circle cx="44" cy="28" r="5.5" fill="#8FAE8B"/>
      <!-- active / current stage -->
      <circle cx="62" cy="40" r="7.5" fill="#E8F0E4"/>
      <circle cx="62" cy="40" r="3.2" fill="#1F2A24"/>
    </g>

    <!-- Wordmark -->
    <g id="wordmark" transform="translate(112 28)" fill="#1F2A24">
      <text x="0" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="600" letter-spacing="-0.03em">Job Tracker</text>
    </g>
  </g>

  <!-- =========================
       HORIZONTAL LOCKUP (compact)
       ========================= -->
  <g id="compact-lockup" transform="translate(80 220)">
    <g>
      <rect width="56" height="56" rx="14" fill="#1F2A24"/>
      <path d="M17 37 C17 37 18.5 22 28.5 18.5 C38.5 15 40 26.5 40 26.5" stroke="#C8D5C3" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <circle cx="17" cy="37" r="3.5" fill="#8FAE8B"/>
      <circle cx="28.5" cy="18.5" r="3.5" fill="#8FAE8B"/>
      <circle cx="40" cy="26.5" r="4.8" fill="#E8F0E4"/>
      <circle cx="40" cy="26.5" r="2" fill="#1F2A24"/>
    </g>
    <text x="72" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.03em" fill="#1F2A24">Job Tracker</text>
  </g>

  <!-- =========================
       SYMBOL ONLY — light
       ========================= -->
  <g id="symbol-light" transform="translate(80 340)">
    <rect width="120" height="120" rx="30" fill="#1F2A24"/>
    <path d="M36 80 C36 80 39 46 60 38 C81 30 84 54 84 54" stroke="#C8D5C3" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="80" r="7.5" fill="#8FAE8B"/>
    <circle cx="60" cy="38" r="7.5" fill="#8FAE8B"/>
    <circle cx="84" cy="54" r="10.5" fill="#E8F0E4"/>
    <circle cx="84" cy="54" r="4.5" fill="#1F2A24"/>
  </g>

  <!-- =========================
       SYMBOL ONLY — sage
       ========================= -->
  <g id="symbol-sage" transform="translate(240 340)">
    <rect width="120" height="120" rx="30" fill="#8FAE8B"/>
    <path d="M36 80 C36 80 39 46 60 38 C81 30 84 54 84 54" stroke="#1F2A24" stroke-width="7.5" stroke-linecap="round" opacity="0.35" fill="none"/>
    <circle cx="36" cy="80" r="7.5" fill="#1F2A24" opacity="0.55"/>
    <circle cx="60" cy="38" r="7.5" fill="#1F2A24" opacity="0.55"/>
    <circle cx="84" cy="54" r="10.5" fill="#F4F1EC"/>
    <circle cx="84" cy="54" r="4.5" fill="#1F2A24"/>
  </g>

  <!-- =========================
       SYMBOL ONLY — outline
       ========================= -->
  <g id="symbol-outline" transform="translate(400 340)">
    <rect width="120" height="120" rx="30" fill="none" stroke="#1F2A24" stroke-width="3"/>
    <path d="M36 80 C36 80 39 46 60 38 C81 30 84 54 84 54" stroke="#1F2A24" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="80" r="7.5" fill="#1F2A24"/>
    <circle cx="60" cy="38" r="7.5" fill="#1F2A24"/>
    <circle cx="84" cy="54" r="10.5" fill="#F4F1EC" stroke="#1F2A24" stroke-width="3.5"/>
    <circle cx="84" cy="54" r="4.5" fill="#1F2A24"/>
  </g>

  <!-- =========================
       MONO / REVERSED
       ========================= -->
  <g id="symbol-mono" transform="translate(560 340)">
    <rect width="120" height="120" rx="30" fill="#1F2A24"/>
    <path d="M36 80 C36 80 39 46 60 38 C81 30 84 54 84 54" stroke="#F4F1EC" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="80" r="7.5" fill="#F4F1EC"/>
    <circle cx="60" cy="38" r="7.5" fill="#F4F1EC"/>
    <circle cx="84" cy="54" r="10.5" fill="#F4F1EC"/>
    <circle cx="84" cy="54" r="4.5" fill="#1F2A24"/>
  </g>

  <!-- =========================
       APP ICON 1024-style crop preview
       ========================= -->
  <g id="app-icon" transform="translate(740 340)">
    <rect width="120" height="120" rx="34" fill="#1F2A24"/>
    <path d="M34 78 C34 78 38 44 60 36 C82 28 86 54 86 54" stroke="#C8D5C3" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="78" r="8" fill="#8FAE8B"/>
    <circle cx="60" cy="36" r="8" fill="#8FAE8B"/>
    <circle cx="86" cy="54" r="11" fill="#E8F0E4"/>
    <circle cx="86" cy="54" r="4.8" fill="#1F2A24"/>
  </g>

  <!-- =========================
       WORDMARK ONLY
       ========================= -->
  <g id="wordmark-only" transform="translate(80 520)">
    <text x="0" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" letter-spacing="-0.03em" fill="#1F2A24">Job Tracker</text>
    <text x="280" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="0.12em" fill="#6F7A72">TRACK · APPLY · ADVANCE</text>
  </g>

  <!-- Labels -->
  <g fill="#8A918A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.14em">
    <text x="80" y="48">PRIMARY LOCKUP</text>
    <text x="80" y="204">COMPACT</text>
    <text x="80" y="328">SYMBOL VARIANTS</text>
    <text x="80" y="492">WORDMARK</text>
  </g>

  <!-- Palette chips -->
  <g transform="translate(720 72)">
    <text x="0" y="0" fill="#8A918A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.14em">PALETTE</text>
    <rect y="16" width="36" height="36" rx="8" fill="#1F2A24"/>
    <rect x="44" y="16" width="36" height="36" rx="8" fill="#8FAE8B"/>
    <rect x="88" y="16" width="36" height="36" rx="8" fill="#C8D5C3"/>
    <rect x="132" y="16" width="36" height="36" rx="8" fill="#E8F0E4" stroke="#D9D4CC"/>
    <rect x="176" y="16" width="36" height="36" rx="8" fill="#F4F1EC" stroke="#D9D4CC"/>
  </g>
</svg>
