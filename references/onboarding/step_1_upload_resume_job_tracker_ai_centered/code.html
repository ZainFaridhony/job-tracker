<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- Top Navigation -->

<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-lg">
<!-- Progress Stepper -->
<div class="w-full max-w-[800px] mx-auto mb-stack-lg">

<div class="h-[6px] w-full bg-surface-container-low rounded-full overflow-hidden">

</div>

</div>
<!-- Onboarding Card -->
<div class="w-full max-w-[1000px] bg-surface-container-lowest rounded-[24px] premium-shadow border border-surface-container overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Illustration -->
<div class="w-full md:w-[40%] bg-surface-container-low p-12 flex items-center justify-center relative">
<div class="w-full aspect-square max-w-[280px] flex items-center justify-center relative">
<!-- Abstract Scanning Illustration -->
<div class="absolute inset-0 bg-white/50 blur-3xl rounded-full"></div>
<div class="relative z-10 w-full h-full border border-outline-variant bg-white rounded-xl premium-shadow p-6 flex flex-col gap-4 animate-pulse">
<div class="h-4 w-1/2 bg-surface-container rounded"></div>
<div class="h-2 w-full bg-surface-container-high rounded"></div>
<div class="h-2 w-full bg-surface-container-high rounded"></div>
<div class="h-2 w-3/4 bg-surface-container-high rounded"></div>
<div class="mt-4 grid grid-cols-2 gap-2">
<div class="h-8 bg-surface-container-lowest border border-outline-variant rounded"></div>
<div class="h-8 bg-surface-container-lowest border border-outline-variant rounded"></div>
</div>
</div>
<!-- Scanner Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary z-20 shadow-[0_0_15px_rgba(0,0,0,0.5)]" style="animation: scan 3s ease-in-out infinite;"></div>
</div>
</div>
<!-- Right Side: Content & Actions -->
<div class="w-full md:w-[60%] p-8 md:p-12 flex flex-col justify-center">
<header class="mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-stack-sm">Upload your resume</h1>
<p class="font-body-lg text-body-lg text-secondary">
                        We'll automatically extract your experience, skills, education, and personalize your dashboard.
                    </p>
</header>
<div class="w-full border-2 border-dashed border-outline-variant rounded-xl p-10 flex flex-col items-center justify-center transition-all duration-300 hover:border-primary group cursor-pointer bg-surface-container-lowest mb-stack-lg" id="drop-zone">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-white" style="font-size: 32px;">upload_file</span>
</div>
<p class="font-body-md text-body-md text-primary font-bold mb-1">Click to upload or drag and drop</p>
<p class="font-label-sm text-label-sm text-secondary">PDF or DOCX (max. 10MB)</p>
<input accept=".pdf,.docx" class="hidden" id="file-input" type="file">
</div>
<div class="flex flex-col gap-4">
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-body-md text-body-md font-bold hover:opacity-90 transition-all transform active:scale-[0.98]" id="upload-btn">
                        Upload Resume
                    </button>

</div>
<div class="mt-stack-lg flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-size: 18px; font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-label-sm text-label-sm text-secondary">Your data is encrypted and secure.</p>
</div>
</div>
</div>
</main>
<!-- Footer -->

<style>
        @keyframes scan {
            0%, 100% { top: 0%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 100%; }
        }
    </style>
<script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-zone-active');
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-zone-active');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length) {
                handleFileUpload(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFileUpload(e.target.files[0]);
            }
        });

        function handleFileUpload(file) {
            const allowedTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            if (!allowedTypes.includes(file.type)) {
                alert('Please upload a PDF or DOCX file.');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                alert('File size exceeds 10MB.');
                return;
            }

            // Visual feedback for successful selection
            dropZone.innerHTML = `
                <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-primary" style="font-size: 32px;">check_circle</span>
                </div>
                <p class="font-body-md text-body-md text-primary font-bold mb-1">${file.name}</p>
                <p class="font-label-sm text-label-sm text-secondary">Ready to analyze</p>
            `;
            uploadBtn.innerText = "Continue to AI Analysis";
        }
    </script>
