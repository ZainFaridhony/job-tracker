<!-- Simple Footer for Onboarding -->

<script>
        // Micro-interaction for the "Go to Dashboard" button
        const dashboardBtn = document.querySelector('button');
        dashboardBtn.addEventListener('mousedown', () => {
            dashboardBtn.style.transform = 'scale(0.97)';
        });
        dashboardBtn.addEventListener('mouseup', () => {
            dashboardBtn.style.transform = 'scale(1)';
        });

        // Trigger the checkmark animation again if visible
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const path = entry.target.querySelector('.check-path');
                    if (path) {
                        path.style.animation = 'none';
                        path.offsetHeight; // trigger reflow
                        path.style.animation = null;
                    }
                }
            });
        });
        observer.observe(document.querySelector('.lg\\:col-span-5'));
    </script>
